name: Build watch / GitHub Pages

on:
  push:
    branches: [astra/exploration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nocturne-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsc --noEmit
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  # Build now; publish only after the repository owner enables hosting.
  deploy:
    if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/astra/exploration'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy presentation
        id: deployment
        uses: actions/deploy-pages@v4
