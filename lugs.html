<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nocturne40 — Arc lug families</title>
<style>body{margin:0;background:#202020;color:#e4ded3;font:15px system-ui}header{padding:18px 24px;max-width:1200px;margin:auto}p{line-height:1.45}select,button{font:inherit}label{margin-right:18px;display:inline-block}main{display:flex;overflow:auto;gap:8px;padding:0 12px}article{width:50%;min-width:420px}iframe{width:100%;height:70vh;min-height:500px;border:0;background:#151515}h2{font-size:15px;font-weight:500}a{color:#e8cba0}.description{min-height:22px}</style></head>
<body><header><p><strong>Nocturne40 · Arc lug families</strong><br>Three related shapes around the current Arc control. Case, strap, dial, materials, socket region, lighting and exposure stay matched.</p>
<label>View <select id="view"><option value="oblique">Oblique</option><option value="dial">Front</option><option value="side">Profile</option><option value="lugtop">Upper lug close view</option><option value="lug">Lug underside</option><option value="loopside">Attachment</option><option value="rake">Case flank</option></select></label>
<label>Environment <select id="env"><option value="studio">Studio</option><option value="bright">Neutral inspection</option></select></label><label><input id="sweep" type="checkbox"> Reflection sweep</label><button id="swap">Swap sides</button>
<p>Choose any pair below. A view selection resets manual orbits. <a href="explore.html">Original Arc comparison</a></p></header>
<main><article><h2><label>Left <select id="leftFamily" aria-label="Left lug family"></select></label><a id="leftLink">Open</a></h2><p class="description" id="leftDescription"></p><iframe id="left" title="Left lug family"></iframe></article><article><h2><label>Right <select id="rightFamily" aria-label="Right lug family"></select></label><a id="rightLink">Open</a></h2><p class="description" id="rightDescription"></p><iframe id="right" title="Right lug family"></iframe></article></main>
<script type="module">
import {LUG_FAMILIES} from './src/design.ts';
const view=document.querySelector('#view'),env=document.querySelector('#env'),sweep=document.querySelector('#sweep');
for(const side of ['left','right']){const select=document.querySelector('#'+side+'Family');for(const [key,value]of Object.entries(LUG_FAMILIES)){const option=document.createElement('option');option.value=key;option.textContent=value.label;select.append(option);}select.value=side==='left'?'arc':'flow';select.onchange=()=>load(side);}
const settings=()=>({type:'nocturne:compare',view:view.value,light:'neutral',pose:'ten-ten',sweep:sweep.checked});
function update(){for(const side of ['left','right'])document.querySelector('#'+side).contentWindow?.postMessage(settings(),location.origin);}
function load(side){const family=document.querySelector('#'+side+'Family').value,q=new URLSearchParams({design:'synthesis',finish:'physical2',exploration:'arc',lug:family,view:view.value,environment:env.value,light:'neutral',pose:'ten-ten'});document.querySelector('#'+side+'Link').href='./?'+q;document.querySelector('#'+side+'Description').textContent=LUG_FAMILIES[family].description;const frame=document.querySelector('#'+side);frame.title=LUG_FAMILIES[family].label+' lug family';q.set('embed','1');frame.src='./?'+q;}
view.onchange=()=>{update();for(const side of ['left','right']){const a=document.querySelector('#'+side+'Link'),url=new URL(a.href);url.searchParams.set('view',view.value);a.href=url;}};env.onchange=()=>{load('left');load('right')};sweep.onchange=update;
document.querySelector('#swap').onclick=()=>{const a=document.querySelector('#leftFamily'),b=document.querySelector('#rightFamily');[a.value,b.value]=[b.value,a.value];load('left');load('right');};
window.addEventListener('message',event=>{if(event.origin===location.origin&&event.data?.type==='nocturne:ready'&&['left','right'].some(s=>document.querySelector('#'+s).contentWindow===event.source))update();});load('left');load('right');
</script></body></html>
