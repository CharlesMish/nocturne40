<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nocturne 40 — train viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #ddd;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: min(42rem, calc(100vw - 24px));
      }
      #orient {
        width: fit-content;
        border: 1px solid #555;
        background: #1c1c1c;
        color: #eee;
        padding: 6px 10px;
        cursor: pointer;
      }
      #hint {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <button type="button" id="orient">Orientation: 180° product (6 at −Y)</button>
      <div id="hint">Loading… R · 1 dial · B caseback · S side · P plates · D face · G grid · X explode · H hands · F markers.</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
